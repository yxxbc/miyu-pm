name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        platform: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package release asset
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ "$RUNNER_OS" = "macOS" ]; then OS=macos; else OS=linux; fi
          ARCH="$(uname -m)"
          [ "$ARCH" = "arm64" ] && ARCH="aarch64"
          mkdir -p dist
          cp target/release/miyu-pm dist/miyu-pm
          tar -C dist -czf "miyu-pm-${VERSION}-${OS}-${ARCH}.tar.gz" miyu-pm
          echo "asset=miyu-pm-${VERSION}-${OS}-${ARCH}.tar.gz" >> "$GITHUB_ENV"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: "miyu-pm-*.tar.gz"
          generate_release_notes: true
