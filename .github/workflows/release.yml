name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        platform: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package release asset
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ "$RUNNER_OS" = "macOS" ]; then OS=macos; else OS=linux; fi
          ARCH="$(uname -m)"
          [ "$ARCH" = "arm64" ] && ARCH="aarch64"
          mkdir -p dist
          cp target/release/miyu-pm dist/miyu-pm
          cp -R tui dist/tui
          tar -C dist -czf "miyu-pm-${VERSION}-${OS}-${ARCH}.tar.gz" miyu-pm tui

      - name: Upload release asset
        uses: actions/upload-artifact@v4
        with:
          name: asset-${{ matrix.platform }}
          path: "miyu-pm-*.tar.gz"
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download assets
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FILES="$(find artifacts -name '*.tar.gz' -type f | sort)"
          PREV_TAG="$(git describe --abbrev=0 --tags "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          NOTES_FILE="$(mktemp)"
          {
            echo "## What changed"
            echo ""
            if [ -n "${PREV_TAG}" ]; then
              git log --oneline --no-merges "${PREV_TAG}..${GITHUB_REF_NAME}" | sed 's/^/- /'
            else
              git log --oneline --no-merges "${GITHUB_REF_NAME}" | sed 's/^/- /' | head -50
            fi
            echo ""
            echo "## Install"
            echo ""
            echo 'curl -fsSL https://raw.githubusercontent.com/yxxbc/miyu-pm/main/install.sh | sh'
          } > "${NOTES_FILE}"
          gh release create "$GITHUB_REF_NAME" $FILES \
            --title "$GITHUB_REF_NAME" \
            --notes-file "${NOTES_FILE}"
