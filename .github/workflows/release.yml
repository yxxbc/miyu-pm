name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        platform: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package release asset
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ "$RUNNER_OS" = "macOS" ]; then OS=macos; else OS=linux; fi
          ARCH="$(uname -m)"
          [ "$ARCH" = "arm64" ] && ARCH="aarch64"
          mkdir -p dist/tui
          cp target/release/miyu-pm dist/miyu-pm
          cp -R tui dist/tui
          tar -C dist -czf "miyu-pm-${VERSION}-${OS}-${ARCH}.tar.gz" miyu-pm tui

      - name: Upload release asset
        uses: actions/upload-artifact@v4
        with:
          name: asset-${{ matrix.platform }}
          path: "miyu-pm-*.tar.gz"
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download assets
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FILES="$(find artifacts -name '*.tar.gz' -type f | sort)"
          gh release create "$GITHUB_REF_NAME" $FILES \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
